<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a2e">
<title>Crystal Clicker</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg-primary: #0a0a2e;
  --bg-secondary: #12123a;
  --bg-card: #1a1a4e;
  --bg-card-hover: #222266;
  --accent: #7c5cfc;
  --accent-light: #a78bfa;
  --accent-glow: rgba(124, 92, 252, 0.4);
  --gold: #fbbf24;
  --gold-glow: rgba(251, 191, 36, 0.4);
  --text-primary: #e8e8ff;
  --text-secondary: #9090c0;
  --text-muted: #606090;
  --success: #34d399;
  --danger: #f87171;
  --crystal-1: #60a5fa;
  --crystal-2: #a78bfa;
  --crystal-3: #f472b6;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%;
  overflow: hidden;
  touch-action: manipulation;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: var(--bg-secondary);
  border-bottom: 1px solid rgba(124, 92, 252, 0.2);
  flex-shrink: 0;
  z-index: 10;
}

.header-title {
  font-size: 16px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--crystal-1), var(--crystal-2), var(--crystal-3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-stats {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text-secondary);
}

.header-stats span {
  display: flex;
  align-items: center;
  gap: 3px;
}

/* Resource Display */
.resource-display {
  text-align: center;
  padding: 12px 16px 8px;
  flex-shrink: 0;
}

.crystal-count {
  font-size: 32px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--crystal-1), var(--crystal-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
  transition: transform 0.1s;
}

.crystal-count.pulse {
  transform: scale(1.05);
}

.crystal-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.cps-display {
  font-size: 13px;
  color: var(--accent-light);
  margin-top: 4px;
}

.prestige-display {
  font-size: 11px;
  color: var(--gold);
  margin-top: 2px;
}

/* Click Area */
.click-area {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  flex-shrink: 0;
}

.crystal-btn {
  position: relative;
  width: 140px;
  height: 140px;
  border: none;
  background: radial-gradient(circle at 35% 35%, #93c5fd, #6366f1, #4338ca);
  border-radius: 20%;
  transform: rotate(45deg);
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
  box-shadow:
    0 0 30px var(--accent-glow),
    inset 0 0 30px rgba(255, 255, 255, 0.1);
  -webkit-tap-highlight-color: transparent;
}

.crystal-btn:active {
  transform: rotate(45deg) scale(0.93);
  box-shadow:
    0 0 50px var(--accent-glow),
    inset 0 0 40px rgba(255, 255, 255, 0.2);
}

.crystal-btn::before {
  content: '';
  position: absolute;
  top: 15%;
  left: 15%;
  width: 30%;
  height: 30%;
  background: linear-gradient(135deg, rgba(255,255,255,0.5), transparent);
  border-radius: 50%;
}

.crystal-btn::after {
  content: '';
  position: absolute;
  top: 10%;
  left: 10%;
  right: 10%;
  bottom: 10%;
  border: 2px solid rgba(255, 255, 255, 0.15);
  border-radius: 15%;
}

.click-power-label {
  position: absolute;
  bottom: -28px;
  left: 50%;
  transform: translateX(-50%) rotate(-45deg);
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
}

/* Floating numbers */
.float-text {
  position: fixed;
  pointer-events: none;
  font-weight: 800;
  font-size: 20px;
  color: var(--gold);
  text-shadow: 0 0 8px var(--gold-glow);
  animation: floatUp 0.9s ease-out forwards;
  z-index: 100;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-80px) scale(0.6); }
}

/* Tab Navigation */
.tab-nav {
  display: flex;
  border-top: 1px solid rgba(124, 92, 252, 0.15);
  border-bottom: 1px solid rgba(124, 92, 252, 0.15);
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.tab-btn {
  flex: 1;
  padding: 8px 4px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.tab-btn .tab-icon {
  font-size: 16px;
}

.tab-btn.active {
  color: var(--accent-light);
  background: rgba(124, 92, 252, 0.1);
}

.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 20%;
  right: 20%;
  height: 2px;
  background: var(--accent);
  border-radius: 1px;
}

.tab-btn .badge {
  position: absolute;
  top: 4px;
  right: 20%;
  width: 8px;
  height: 8px;
  background: var(--danger);
  border-radius: 50%;
  display: none;
}

.tab-btn .badge.show {
  display: block;
}

/* Tab Content */
.tab-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--accent) transparent;
}

.tab-panel {
  display: none;
  padding: 8px 12px 16px;
}

.tab-panel.active {
  display: block;
}

.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 12px 0 8px;
  padding-left: 4px;
}

/* Upgrade Cards */
.upgrade-card {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  border: 1px solid rgba(124, 92, 252, 0.15);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
}

.upgrade-card:active {
  transform: scale(0.98);
  background: var(--bg-card-hover);
}

.upgrade-card.affordable {
  border-color: rgba(124, 92, 252, 0.4);
  box-shadow: 0 0 10px rgba(124, 92, 252, 0.1);
}

.upgrade-card.locked {
  opacity: 0.4;
  pointer-events: none;
}

.upgrade-card.max-level {
  border-color: rgba(251, 191, 36, 0.3);
}

.upgrade-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  background: rgba(124, 92, 252, 0.2);
}

.upgrade-info {
  flex: 1;
  min-width: 0;
}

.upgrade-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
}

.upgrade-desc {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 1px;
}

.upgrade-effect {
  font-size: 11px;
  color: var(--accent-light);
  margin-top: 2px;
}

.upgrade-right {
  text-align: right;
  flex-shrink: 0;
}

.upgrade-cost {
  font-size: 13px;
  font-weight: 700;
  color: var(--crystal-1);
}

.upgrade-level {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Progress bar on upgrade card */
.upgrade-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  background: var(--accent);
  transition: width 0.3s;
}

/* Achievement Cards */
.achievement-card {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  border: 1px solid rgba(124, 92, 252, 0.1);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 6px;
  transition: all 0.2s;
}

.achievement-card.unlocked {
  border-color: rgba(251, 191, 36, 0.3);
  background: rgba(251, 191, 36, 0.05);
}

.achievement-card.locked {
  opacity: 0.35;
}

.achievement-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  background: rgba(251, 191, 36, 0.15);
  flex-shrink: 0;
}

.achievement-card.locked .achievement-icon {
  background: rgba(100, 100, 140, 0.15);
}

.achievement-info {
  flex: 1;
}

.achievement-name {
  font-size: 13px;
  font-weight: 700;
}

.achievement-desc {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 1px;
}

.achievement-reward {
  font-size: 11px;
  color: var(--gold);
  margin-top: 2px;
}

/* Prestige Panel */
.prestige-panel {
  text-align: center;
  padding: 16px;
}

.prestige-info-box {
  background: var(--bg-card);
  border: 1px solid rgba(251, 191, 36, 0.2);
  border-radius: 16px;
  padding: 20px 16px;
  margin-bottom: 16px;
}

.prestige-stars {
  font-size: 36px;
  font-weight: 800;
  color: var(--gold);
  text-shadow: 0 0 20px var(--gold-glow);
}

.prestige-stars-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.prestige-bonus {
  font-size: 14px;
  color: var(--accent-light);
  margin-top: 8px;
}

.prestige-next {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 12px;
}

.prestige-next strong {
  color: var(--gold);
}

.prestige-btn {
  display: inline-block;
  padding: 14px 32px;
  background: linear-gradient(135deg, #d97706, #f59e0b);
  border: none;
  border-radius: 12px;
  color: #1a1a2e;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 16px;
  transition: all 0.2s;
  box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
}

.prestige-btn:active {
  transform: scale(0.95);
}

.prestige-btn:disabled {
  opacity: 0.3;
  pointer-events: none;
}

.prestige-upgrade-card {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  border: 1px solid rgba(251, 191, 36, 0.15);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s;
}

.prestige-upgrade-card:active {
  transform: scale(0.98);
}

.prestige-upgrade-card.affordable {
  border-color: rgba(251, 191, 36, 0.4);
}

.prestige-upgrade-card.purchased {
  border-color: rgba(52, 211, 153, 0.3);
  opacity: 0.6;
  pointer-events: none;
}

/* Settings Panel */
.settings-group {
  background: var(--bg-card);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 12px;
}

.settings-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(124, 92, 252, 0.1);
}

.settings-item:last-child {
  border-bottom: none;
}

.settings-label {
  font-size: 13px;
  font-weight: 600;
}

.settings-sublabel {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.settings-btn {
  padding: 6px 16px;
  border: 1px solid rgba(124, 92, 252, 0.3);
  background: rgba(124, 92, 252, 0.1);
  color: var(--accent-light);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.settings-btn.danger {
  border-color: rgba(248, 113, 113, 0.3);
  background: rgba(248, 113, 113, 0.1);
  color: var(--danger);
}

.toggle-switch {
  width: 44px;
  height: 24px;
  background: var(--text-muted);
  border-radius: 12px;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  border: none;
}

.toggle-switch.active {
  background: var(--accent);
}

.toggle-switch::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s;
}

.toggle-switch.active::after {
  transform: translateX(20px);
}

/* Stats display */
.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid rgba(124, 92, 252, 0.08);
  font-size: 13px;
}

.stat-label { color: var(--text-secondary); }
.stat-value { color: var(--text-primary); font-weight: 600; }

/* Modal overlay */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  padding: 20px;
}

.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  background: var(--bg-secondary);
  border: 1px solid rgba(124, 92, 252, 0.3);
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  max-width: 320px;
  width: 100%;
  transform: scale(0.9);
  transition: transform 0.2s;
}

.modal-overlay.show .modal-box {
  transform: scale(1);
}

.modal-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--gold);
  margin-bottom: 8px;
}

.modal-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 16px;
}

.modal-reward {
  font-size: 20px;
  font-weight: 800;
  color: var(--crystal-1);
  margin-bottom: 16px;
}

.modal-btn {
  padding: 10px 32px;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.modal-btn:active {
  transform: scale(0.95);
}

/* Achievement toast */
.toast {
  position: fixed;
  top: calc(var(--safe-top) + 60px);
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: linear-gradient(135deg, #1a1a4e, #2a2a6e);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 10px 20px;
  z-index: 500;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast-icon { font-size: 20px; }
.toast-text {
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
}

/* Particles container */
#particles {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 50;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  animation: particleFly 0.8s ease-out forwards;
}

@keyframes particleFly {
  0% { opacity: 1; transform: translate(0, 0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
}

/* Screen shake */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-2px); }
  75% { transform: translateX(2px); }
}

.shake {
  animation: shake 0.1s ease;
}

/* Scrollbar */
.tab-content::-webkit-scrollbar { width: 4px; }
.tab-content::-webkit-scrollbar-track { background: transparent; }
.tab-content::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="header">
    <div class="header-title">Crystal Clicker</div>
    <div class="header-stats">
      <span id="header-cps">0/s</span>
      <span id="header-clicks">0 tap</span>
    </div>
  </div>

  <!-- Resource Display -->
  <div class="resource-display">
    <div class="crystal-count" id="crystal-count">0</div>
    <div class="crystal-label">Crystals</div>
    <div class="cps-display" id="cps-display">0 crystals / sec</div>
    <div class="prestige-display" id="prestige-display"></div>
  </div>

  <!-- Click Area -->
  <div class="click-area">
    <button class="crystal-btn" id="crystal-btn">
      <span class="click-power-label" id="click-power-label">+1</span>
    </button>
  </div>

  <!-- Tab Navigation -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="upgrades">
      <span class="tab-icon">&#9650;</span>
      <span>Upgrade</span>
      <span class="badge" id="badge-upgrades"></span>
    </button>
    <button class="tab-btn" data-tab="auto">
      <span class="tab-icon">&#9881;</span>
      <span>Auto</span>
      <span class="badge" id="badge-auto"></span>
    </button>
    <button class="tab-btn" data-tab="prestige">
      <span class="tab-icon">&#9733;</span>
      <span>Prestige</span>
      <span class="badge" id="badge-prestige"></span>
    </button>
    <button class="tab-btn" data-tab="achievements">
      <span class="tab-icon">&#127942;</span>
      <span>Achieve</span>
      <span class="badge" id="badge-achievements"></span>
    </button>
    <button class="tab-btn" data-tab="settings">
      <span class="tab-icon">&#9776;</span>
      <span>Menu</span>
    </button>
  </nav>

  <!-- Tab Content -->
  <div class="tab-content">
    <!-- Upgrades Panel -->
    <div class="tab-panel active" id="panel-upgrades"></div>

    <!-- Auto Panel -->
    <div class="tab-panel" id="panel-auto"></div>

    <!-- Prestige Panel -->
    <div class="tab-panel" id="panel-prestige"></div>

    <!-- Achievements Panel -->
    <div class="tab-panel" id="panel-achievements"></div>

    <!-- Settings Panel -->
    <div class="tab-panel" id="panel-settings"></div>
  </div>
</div>

<!-- Particles -->
<div id="particles"></div>

<!-- Toast -->
<div class="toast" id="toast">
  <span class="toast-icon" id="toast-icon"></span>
  <span class="toast-text" id="toast-text"></span>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-text" id="modal-text"></div>
    <div class="modal-reward" id="modal-reward"></div>
    <button class="modal-btn" id="modal-btn">OK</button>
  </div>
</div>

<script>
// =========================================================
// Crystal Clicker - Full Featured Mobile Clicker Game
// =========================================================

(function() {
'use strict';

// ─── Number Formatting ───────────────────────────────────
const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];

function formatNum(n) {
  if (n < 1000) return Math.floor(n).toString();
  const tier = Math.min(Math.floor(Math.log10(Math.abs(n)) / 3), SUFFIXES.length - 1);
  const scaled = n / Math.pow(10, tier * 3);
  return scaled.toFixed(scaled < 10 ? 2 : scaled < 100 ? 1 : 0) + SUFFIXES[tier];
}

function formatTime(seconds) {
  if (seconds < 60) return `${Math.floor(seconds)}s`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ${Math.floor(seconds % 60)}s`;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return `${h}h ${m}m`;
}

function formatPercent(mult) {
  return `${Math.round((mult - 1) * 100)}%`;
}

function getAchievementRewardText(reward) {
  if (!reward) return '';
  return reward.label || '';
}

// ─── Audio Engine (Web Audio API) ────────────────────────
const AudioEngine = {
  ctx: null,
  enabled: true,

  init() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { this.enabled = false; }
  },

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  play(freq, duration, type, vol) {
    if (!this.enabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (duration || 0.1));
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + (duration || 0.1));
    } catch (e) {}
  },

  click() { this.play(800, 0.06, 'sine', 0.06); },
  buy() { this.play(600, 0.1, 'triangle', 0.06); this.play(900, 0.15, 'triangle', 0.04); },
  achievement() {
    setTimeout(() => this.play(523, 0.15, 'sine', 0.07), 0);
    setTimeout(() => this.play(659, 0.15, 'sine', 0.07), 100);
    setTimeout(() => this.play(784, 0.2, 'sine', 0.07), 200);
  },
  prestige() {
    setTimeout(() => this.play(440, 0.2, 'sine', 0.08), 0);
    setTimeout(() => this.play(554, 0.2, 'sine', 0.08), 150);
    setTimeout(() => this.play(659, 0.2, 'sine', 0.08), 300);
    setTimeout(() => this.play(880, 0.3, 'sine', 0.08), 450);
  },
  error() { this.play(200, 0.15, 'square', 0.04); }
};

let state = getDefaultState();

function getDefaultState() {
  return {
    crystals: 0,
    totalEarned: 0,
    totalClicks: 0,
    totalUpgrades: 0,
    clickPower: 1,
    cps: 0,

    // Achievements

    // Settings

    particlesEnabled: true,
    // Timestamps

    lastOnline: Date.now(),
    // Stats
    totalTimePlayed: 0,
    bestCps: 0,
    bestClickPower: 0,
  };
}

// ─── Computed Values ─────────────────────────────────────
function getPrestigeMultipliers() {
  let clickMult = 1, cpsMult = 1, costReduction = 1, offlineMult = 1, headStart = 0, allMult = 1, starGain = 1, prestigeCarry = 0;
  for (const pid of state.prestigeUpgrades) {
    const pu = PRESTIGE_UPGRADES.find(p => p.id === pid);
    if (!pu) continue;
    switch (pu.effect) {
      case 'clickMult': clickMult *= pu.value; break;
      case 'cpsMult': cpsMult *= pu.value; break;
      case 'costReduction': costReduction *= pu.value; break;
      case 'offlineMult': offlineMult *= pu.value; break;
      case 'headStart': headStart += pu.value * state.stars; break;
      case 'allMult': allMult *= pu.value; break;
      case 'starGain': starGain *= pu.value; break;
      case 'prestigeCarry': prestigeCarry += pu.value; break;
    }
  }
  // Base star bonus: +5% per star
  const starBonus = 1 + state.stars * 0.05;
  return {
    clickMult: clickMult * starBonus * allMult,
    cpsMult: cpsMult * starBonus * allMult,
    costReduction,
    offlineMult,
    headStart,
    starGain,
    prestigeCarry: Math.min(prestigeCarry, 0.9),
  };
}

function getAchievementBoosts() {
  const boosts = {
    clickMult: 1,
    cpsMult: 1,
    allMult: 1,
    costReduction: 1,
    starGain: 1,
  };

  for (const id of state.unlockedAchievements) {
    const achievement = ACHIEVEMENTS.find(a => a.id === id);
    if (!achievement || !achievement.reward) continue;
    const { type, value } = achievement.reward;
    if (type in boosts) boosts[type] *= value;
  }

  return boosts;
}

function calcClickPower() {
  let base = 1;
  for (const u of CLICK_UPGRADES) {
    const lv = state.clickLevels[u.id] || 0;
    base += u.power * lv;
  }
  const m = getPrestigeMultipliers();
  const a = getAchievementBoosts();
  return Math.floor(base * m.clickMult * a.clickMult * a.allMult);
}

function calcCPS() {
  let base = 0;
  for (const u of AUTO_UPGRADES) {
    const lv = state.autoLevels[u.id] || 0;
    base += u.cps * lv;
  }
  const m = getPrestigeMultipliers();
  const a = getAchievementBoosts();
  return Math.floor(base * m.cpsMult * a.cpsMult * a.allMult);
}

function calcUpgradeCost(baseCost, costMult, level) {
  const m = getPrestigeMultipliers();
  const a = getAchievementBoosts();
  return Math.floor(baseCost * Math.pow(costMult, level) * m.costReduction * a.costReduction);
}

function calcPrestigeStars() {
  // Stars earned based on total crystals earned this run
  const m = getPrestigeMultipliers();
  const a = getAchievementBoosts();
  return Math.floor(Math.pow(state.totalEarned / 1e6, 0.5) * m.starGain * a.starGain);
}

// ─── Particles ───────────────────────────────────────────
function spawnParticles(x, y, count) {
  const colors = ['#60a5fa', '#a78bfa', '#f472b6', '#fbbf24', '#34d399'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 60;
    el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    particlesContainer.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }
}

function renderUpgrades() {
  const panel = $('panel-upgrades');
  let html = '<div class="section-title">Tap Power</div>';

  for (const u of CLICK_UPGRADES) {
    const lv = state.clickLevels[u.id] || 0;
    const cost = calcUpgradeCost(u.baseCost, u.costMult, lv);
    const maxed = lv >= u.maxLv;
    const affordable = state.crystals >= cost && !maxed;
    const unlocked = !u.unlock || state.totalEarned >= u.unlock;
    const progress = Math.min(state.crystals / cost * 100, 100);

    if (!unlocked) {
      html += `<div class="upgrade-card locked">
        <div class="upgrade-icon">${u.icon}</div>
        <div class="upgrade-info">
          <div class="upgrade-name">???</div>
          <div class="upgrade-desc">Earn ${formatNum(u.unlock)} total to unlock</div>
        </div>
      </div>`;
      continue;
    }

    html += `<div class="upgrade-card ${affordable ? 'affordable' : ''} ${maxed ? 'max-level' : ''}"
      data-type="click" data-id="${u.id}">
      <div class="upgrade-icon">${u.icon}</div>
      <div class="upgrade-info">
        <div class="upgrade-name">${u.name}</div>
        <div class="upgrade-desc">${u.desc}</div>
        <div class="upgrade-effect">+${formatNum(u.power)} per tap</div>
      </div>
      <div class="upgrade-right">

          `<div class="upgrade-cost">${formatNum(cost)}</div>`}
        <div class="upgrade-level">Lv.${lv}/${u.maxLv}</div>
      </div>
      ${!maxed ? `<div class="upgrade-progress" style="width:${progress}%"></div>` : ''}
    </div>`;
  }

  panel.innerHTML = html;

  // Bind click events
  panel.querySelectorAll('.upgrade-card[data-type="click"]').forEach(card => {
    card.addEventListener('click', () => buyClickUpgrade(card.dataset.id));

    }

    const totalCps = u.cps * lv;
    html += `<div class="upgrade-card ${affordable ? 'affordable' : ''} ${maxed ? 'max-level' : ''}"
      data-type="auto" data-id="${u.id}">
      <div class="upgrade-icon">${u.icon}</div>
      <div class="upgrade-info">
        <div class="upgrade-name">${u.name}</div>
        <div class="upgrade-desc">${u.desc}</div>
        <div class="upgrade-effect">${lv > 0 ? `Total: +${formatNum(totalCps)}/s` : 'Not owned'}</div>
      </div>
      <div class="upgrade-right">
        ${maxed ? '<div class="upgrade-cost" style="color:var(--gold);">MAX</div>' :
          `<div class="upgrade-cost">${formatNum(cost)}</div>`}
        <div class="upgrade-level">Lv.${lv}/${u.maxLv}</div>
      </div>
      ${!maxed ? `<div class="upgrade-progress" style="width:${progress}%"></div>` : ''}
    </div>`;
  }

  panel.innerHTML = html;

  panel.querySelectorAll('.upgrade-card[data-type="auto"]').forEach(card => {
    card.addEventListener('click', () => buyAutoUpgrade(card.dataset.id));
  });
}

function renderPrestige() {
  const panel = $('panel-prestige');
  const potentialStars = calcPrestigeStars();
  const newStars = Math.max(0, potentialStars - 0); // stars earned this prestige
  const m = getPrestigeMultipliers();
  const currentBonus = Math.floor((1 + state.stars * 0.05) * 100 - 100);

  let html = `<div class="prestige-panel">
    <div class="prestige-info-box">
      <div class="prestige-stars">${state.stars} &#11088;</div>
      <div class="prestige-stars-label">Prestige Stars</div>
      <div class="prestige-bonus">Current bonus: +${currentBonus}% all production</div>
      <div class="prestige-next">
        Prestige now for <strong>+${newStars} &#11088;</strong><br>
        <small>(Need ${formatNum(1e6)} total earned for first star)</small><br>
        <small>Carry over: <strong>${Math.floor(m.prestigeCarry * 100)}%</strong> crystals</small>
      </div>
      <button class="prestige-btn" id="prestige-btn" ${newStars < 1 ? 'disabled' : ''}>
        &#11088; Prestige (+${newStars} stars)
      </button>
    </div>

    <div class="section-title">Star Upgrades</div>`;

  for (const pu of PRESTIGE_UPGRADES) {
    const purchased = state.prestigeUpgrades.includes(pu.id);
    const affordable = state.stars >= pu.cost && !purchased;
    html += `<div class="prestige-upgrade-card ${affordable ? 'affordable' : ''} ${purchased ? 'purchased' : ''}"
      data-id="${pu.id}">
      <div class="upgrade-icon" style="background:rgba(251,191,36,0.15);">${pu.icon}</div>
      <div class="upgrade-info">
        <div class="upgrade-name">${pu.name}</div>
        <div class="upgrade-desc">${pu.desc}</div>
      </div>
      <div class="upgrade-right">
        <div class="upgrade-cost" style="color:var(--gold);">${purchased ? '&#10003;' : pu.cost + ' &#11088;'}</div>
      </div>
    </div>`;
  }

  html += '</div>';
  panel.innerHTML = html;

  // Prestige button
  const prestigeBtn = $('prestige-btn');
  if (prestigeBtn) {
    prestigeBtn.addEventListener('click', () => doPrestige(newStars));
  }

  // Prestige upgrade clicks
  panel.querySelectorAll('.prestige-upgrade-card:not(.purchased)').forEach(card => {
    card.addEventListener('click', () => buyPrestigeUpgrade(card.dataset.id));
  });
}

function renderAchievements() {
  const panel = $('panel-achievements');
  const unlocked = state.unlockedAchievements.length;
  const total = ACHIEVEMENTS.length;

  let html = `<div class="section-title">Achievements (${unlocked}/${total})</div>`;

  for (const a of ACHIEVEMENTS) {
    const isUnlocked = state.unlockedAchievements.includes(a.id);
    html += `<div class="achievement-card ${isUnlocked ? 'unlocked' : 'locked'}">
      <div class="achievement-icon">${isUnlocked ? a.icon : '&#128274;'}</div>
      <div class="achievement-info">
        <div class="achievement-name">${isUnlocked ? a.name : '???'}</div>
        <div class="achievement-desc">${a.desc}</div>
        ${a.reward ? `<div class="achievement-reward">${isUnlocked ? '&#10003; ' : ''}${getAchievementRewardText(a.reward)}</div>` : ''}
      </div>
    </div>`;
  }

  panel.innerHTML = html;
}

function renderSettings() {
  const panel = $('panel-settings');
  const achievementBoosts = getAchievementBoosts();

  panel.innerHTML = `
    <div class="section-title">Settings</div>
    <div class="settings-group">
      <div class="settings-item">
        <div>
          <div class="settings-label">Sound Effects</div>
        </div>
        <button class="toggle-switch ${state.soundEnabled ? 'active' : ''}" id="toggle-sound"></button>
      </div>
      <div class="settings-item">
        <div>
          <div class="settings-label">Particles</div>
        </div>
        <button class="toggle-switch ${state.particlesEnabled ? 'active' : ''}" id="toggle-particles"></button>
      </div>
    </div>

    <div class="section-title">Save Data</div>
    <div class="settings-group">
      <div class="settings-item">
        <div>
          <div class="settings-label">Manual Save</div>
          <div class="settings-sublabel">Auto saves every 30s</div>
        </div>
        <button class="settings-btn" id="btn-save">Save</button>
      </div>
      <div class="settings-item">
        <div>
          <div class="settings-label">Export Save</div>
          <div class="settings-sublabel">Copy save data to clipboard</div>
        </div>
        <button class="settings-btn" id="btn-export">Export</button>
      </div>
      <div class="settings-item">
        <div>
          <div class="settings-label">Import Save</div>
          <div class="settings-sublabel">Paste save data to restore</div>
        </div>
        <button class="settings-btn" id="btn-import">Import</button>
      </div>
      <div class="settings-item">
        <div>
          <div class="settings-label">Reset All Data</div>
          <div class="settings-sublabel">Warning: Cannot be undone!</div>
        </div>
        <button class="settings-btn danger" id="btn-reset">Reset</button>
      </div>
    </div>

    <div class="section-title">Stats</div>
    <div class="settings-group" style="padding:8px 16px;">
      <div class="stat-row"><span class="stat-label">Total Clicks</span><span class="stat-value">${formatNum(state.totalClicks)}</span></div>
      <div class="stat-row"><span class="stat-label">Total Earned</span><span class="stat-value">${formatNum(state.totalEarned)}</span></div>
      <div class="stat-row"><span class="stat-label">Click Power</span><span class="stat-value">${formatNum(calcClickPower())}</span></div>
      <div class="stat-row"><span class="stat-label">Auto CPS</span><span class="stat-value">${formatNum(calcCPS())}/s</span></div>
      <div class="stat-row"><span class="stat-label">Prestige Stars</span><span class="stat-value">${state.stars} &#11088;</span></div>
      <div class="stat-row"><span class="stat-label">Total Prestiges</span><span class="stat-value">${state.totalPrestiges}</span></div>
      <div class="stat-row"><span class="stat-label">Star Bonus</span><span class="stat-value">+${Math.floor(state.stars * 5)}%</span></div>
      <div class="stat-row"><span class="stat-label">Upgrades Bought</span><span class="stat-value">${state.totalUpgrades}</span></div>
      <div class="stat-row"><span class="stat-label">Achievements</span><span class="stat-value">${state.unlockedAchievements.length}/${ACHIEVEMENTS.length}</span></div>
      <div class="stat-row"><span class="stat-label">Achievement Prod Boost</span><span class="stat-value">+${formatPercent(achievementBoosts.allMult)}</span></div>
      <div class="stat-row"><span class="stat-label">Achievement Star Boost</span><span class="stat-value">+${formatPercent(achievementBoosts.starGain)}</span></div>
      <div class="stat-row"><span class="stat-label">Time Played</span><span class="stat-value">${formatTime(state.totalTimePlayed)}</span></div>
      <div class="stat-row" style="border:none;"><span class="stat-label">Best CPS</span><span class="stat-value">${formatNum(state.bestCps)}/s</span></div>
    </div>
  `;

  // Settings event listeners
  $('toggle-sound').addEventListener('click', () => {
    state.soundEnabled = !state.soundEnabled;
    AudioEngine.enabled = state.soundEnabled;
    renderSettings();
  });

  $('toggle-particles').addEventListener('click', () => {
    state.particlesEnabled = !state.particlesEnabled;
    renderSettings();
  });

  $('btn-save').addEventListener('click', () => {
    saveGame();
    showToast('&#128190;', 'Game saved!');
  });

  $('btn-export').addEventListener('click', exportSave);
  $('btn-import').addEventListener('click', importSave);
  $('btn-reset').addEventListener('click', resetGame);
}

function renderTab(tab) {
  switch (tab) {
    case 'upgrades': renderUpgrades(); break;
    case 'auto': renderAuto(); break;
    case 'prestige': renderPrestige(); break;
    case 'achievements': renderAchievements(); break;
    case 'settings': renderSettings(); break;
  }
}

// ─── Buy Logic ───────────────────────────────────────────
function buyClickUpgrade(id) {
  const u = CLICK_UPGRADES.find(u => u.id === id);
  if (!u) return;
  const lv = state.clickLevels[u.id] || 0;
  if (lv >= u.maxLv) return;
  const cost = calcUpgradeCost(u.baseCost, u.costMult, lv);
  if (state.crystals < cost) {
    AudioEngine.error();
    return;
  }
  state.crystals -= cost;
  state.clickLevels[u.id] = lv + 1;
  state.totalUpgrades++;
  AudioEngine.buy();
  updateDisplay();
  renderUpgrades();
  checkAchievements();
}

function buyAutoUpgrade(id) {
  const u = AUTO_UPGRADES.find(u => u.id === id);
  if (!u) return;
  const lv = state.autoLevels[u.id] || 0;
  if (lv >= u.maxLv) return;
  const cost = calcUpgradeCost(u.baseCost, u.costMult, lv);
  if (state.crystals < cost) {
    AudioEngine.error();
    return;
  }
  state.crystals -= cost;
  state.autoLevels[u.id] = lv + 1;
  state.totalUpgrades++;
  AudioEngine.buy();
  updateDisplay();
  renderAuto();
  checkAchievements();
}

function buyPrestigeUpgrade(id) {
  const pu = PRESTIGE_UPGRADES.find(p => p.id === id);
  if (!pu) return;
  if (state.prestigeUpgrades.includes(id)) return;
  if (state.stars < pu.cost) {
    AudioEngine.error();
    return;
  }
  state.stars -= pu.cost;
  state.prestigeUpgrades.push(id);
  AudioEngine.buy();
  updateDisplay();
  renderPrestige();
}

function doPrestige(newStars) {
  if (newStars < 1) return;

  const m = getPrestigeMultipliers();
  const carryCrystal = Math.floor(state.crystals * m.prestigeCarry);

  if (!confirm(`Prestige for +${newStars} stars?\nAll crystals and upgrades will be reset, but you keep stars and star upgrades.`)) return;

  state.stars += newStars;
  state.totalPrestiges++;

  // Reset progress but keep prestige data
  const keepStars = state.stars;
  const keepPrestiges = state.totalPrestiges;
  const keepPrestigeUpgrades = [...state.prestigeUpgrades];
  const keepAchievements = [...state.unlockedAchievements];
  const keepSettings = { sound: state.soundEnabled, particles: state.particlesEnabled };
  const keepStats = {
    totalClicks: state.totalClicks,
    totalUpgrades: state.totalUpgrades,
    totalTimePlayed: state.totalTimePlayed,
    bestCps: Math.max(state.bestCps, calcCPS()),
    bestClickPower: Math.max(state.bestClickPower, calcClickPower()),
  };

  // Reset
  state = getDefaultState();
  state.stars = keepStars;
  state.totalPrestiges = keepPrestiges;
  state.prestigeUpgrades = keepPrestigeUpgrades;
  state.unlockedAchievements = keepAchievements;
  state.soundEnabled = keepSettings.sound;
  state.particlesEnabled = keepSettings.particles;
  state.totalClicks = keepStats.totalClicks;
  state.totalUpgrades = keepStats.totalUpgrades;
  state.totalTimePlayed = keepStats.totalTimePlayed;
  state.bestCps = keepStats.bestCps;
  state.bestClickPower = keepStats.bestClickPower;

  // Head start
  if (m.headStart > 0) {
    state.crystals = m.headStart;
    state.totalEarned = m.headStart;
  }

  if (carryCrystal > 0) {
    state.crystals += carryCrystal;
    state.totalEarned += carryCrystal;
  }

  AudioEngine.prestige();
  showToast('&#11088;', `Prestige! +${newStars} stars!`);

  updateDisplay();
  renderTab(activeTab);
  saveGame();
}

// ─── Achievements ────────────────────────────────────────
function checkAchievements() {
  const checkState = {
    totalClicks: state.totalClicks,
    totalEarned: state.totalEarned,
    cps: calcCPS(),
    totalPrestiges: state.totalPrestiges,
    totalUpgrades: state.totalUpgrades,
  };

  for (const a of ACHIEVEMENTS) {
    if (state.unlockedAchievements.includes(a.id)) continue;
    if (a.check(checkState)) {
      state.unlockedAchievements.push(a.id);
      AudioEngine.achievement();
      const rewardText = a.reward ? ` (${getAchievementRewardText(a.reward)})` : '';
      showToast(a.icon, a.name + ' unlocked!' + rewardText);

      // Update achievements badge
      updateBadges();
    }
  }
}

function updateBadges() {
  // Check for affordable upgrades
  let hasAffordableClick = false;
  for (const u of CLICK_UPGRADES) {
    const lv = state.clickLevels[u.id] || 0;
    if (lv >= u.maxLv) continue;
    const unlocked = !u.unlock || state.totalEarned >= u.unlock;
    if (!unlocked) continue;
    if (state.crystals >= calcUpgradeCost(u.baseCost, u.costMult, lv)) {
      hasAffordableClick = true;
      break;
    }
  }

  let hasAffordableAuto = false;
  for (const u of AUTO_UPGRADES) {
    const lv = state.autoLevels[u.id] || 0;
    if (lv >= u.maxLv) continue;
    const unlocked = !u.unlock || state.totalEarned >= u.unlock;
    if (!unlocked) continue;
    if (state.crystals >= calcUpgradeCost(u.baseCost, u.costMult, lv)) {
      hasAffordableAuto = true;
      break;
    }
  }

  const canPrestige = calcPrestigeStars() > 0;

  $('badge-upgrades').classList.toggle('show', hasAffordableClick);
  $('badge-auto').classList.toggle('show', hasAffordableAuto);
  $('badge-prestige').classList.toggle('show', canPrestige);
}

// ─── Display Update ──────────────────────────────────────
function updateDisplay() {
  const cp = calcClickPower();
  const cps = calcCPS();

  state.clickPower = cp;
  state.cps = cps;
  state.bestCps = Math.max(state.bestCps, cps);

  crystalCountEl.textContent = formatNum(state.crystals);
  cpsDisplayEl.textContent = `${formatNum(cps)} crystals / sec`;
  clickPowerLabel.innerHTML = `+${formatNum(cp)}`;
  headerCps.textContent = `${formatNum(cps)}/s`;
  headerClicks.textContent = `${formatNum(state.totalClicks)} tap`;

  if (state.stars > 0) {
    prestigeDisplayEl.innerHTML = `&#11088; ${state.stars} stars (+${Math.floor(state.stars * 5)}% bonus)`;
  } else {
    prestigeDisplayEl.textContent = '';
  }

  updateBadges();
}

// ─── Game Loop ───────────────────────────────────────────
let lastTick = Date.now();

function gameTick() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;

  // Auto CPS
  const cps = calcCPS();
  if (cps > 0) {
    const earned = cps * dt;
    state.crystals += earned;
    state.totalEarned += earned;
  }

  state.totalTimePlayed += dt;

  updateDisplay();

  // Re-render active tab periodically for progress bars
  if (activeTab === 'upgrades' || activeTab === 'auto') {
    renderTab(activeTab);
  }

  checkAchievements();
}

// Run game loop at ~4 ticks per second for smooth updates without battery drain
setInterval(gameTick, 250);

// ─── Save / Load ─────────────────────────────────────────
const SAVE_KEY = 'crystal_clicker_save';

function saveGame() {
  state.lastSave = Date.now();
  state.lastOnline = Date.now();
  try {
    const data = JSON.stringify(state);
    localStorage.setItem(SAVE_KEY, data);
  } catch (e) {
    console.warn('Save failed:', e);
  }
}

function loadGame() {
  try {
    const data = localStorage.getItem(SAVE_KEY);
    if (!data) return false;
    const saved = JSON.parse(data);
    // Merge with defaults to handle new fields
    const defaults = getDefaultState();
    state = { ...defaults, ...saved };
    // Ensure arrays are arrays
    if (!Array.isArray(state.prestigeUpgrades)) state.prestigeUpgrades = [];
    if (!Array.isArray(state.unlockedAchievements)) state.unlockedAchievements = [];
    if (typeof state.clickLevels !== 'object') state.clickLevels = {};
    if (typeof state.autoLevels !== 'object') state.autoLevels = {};
    return true;
  } catch (e) {
    console.warn('Load failed:', e);
    return false;
  }
}

function exportSave() {
  saveGame();
  const data = localStorage.getItem(SAVE_KEY);
  if (!data) return;
  const encoded = btoa(data);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(encoded).then(() => {
      showToast('&#128203;', 'Save data copied!');
    }).catch(() => {
      prompt('Copy this save data:', encoded);
    });
  } else {
    prompt('Copy this save data:', encoded);
  }
}

function importSave() {
  const input = prompt('Paste your save data:');
  if (!input) return;
  try {
    const decoded = atob(input.trim());
    const parsed = JSON.parse(decoded);
    if (typeof parsed.crystals !== 'number') throw new Error('Invalid save');
    localStorage.setItem(SAVE_KEY, decoded);
    loadGame();
    updateDisplay();
    renderTab(activeTab);
    showToast('&#128230;', 'Save imported!');
  } catch (e) {
    alert('Invalid save data. Please check and try again.');
  }
}

function resetGame() {
  if (!confirm('Reset ALL data? This cannot be undone!')) return;
  if (!confirm('Are you really sure? Everything will be lost!')) return;
  localStorage.removeItem(SAVE_KEY);
  state = getDefaultState();
  updateDisplay();
  renderTab(activeTab);
  showToast('&#128465;', 'All data reset.');
}

// Auto-save every 30 seconds
setInterval(saveGame, 30000);

// ─── Offline Rewards ─────────────────────────────────────
function calcOfflineRewards() {
  if (!state.lastOnline) return;
  const now = Date.now();
  const elapsed = (now - state.lastOnline) / 1000;

  // Minimum 60 seconds away for offline rewards
  if (elapsed < 60) return;

  // Cap at 24 hours
  const cappedElapsed = Math.min(elapsed, 86400);

  const cps = calcCPS();
  if (cps <= 0) return;

  // Base offline rate: 50% of CPS
  let offlineRate = 0.5;
  const m = getPrestigeMultipliers();
  offlineRate *= m.offlineMult;

  const earned = Math.floor(cps * cappedElapsed * offlineRate);
  if (earned <= 0) return;

  state.crystals += earned;
  state.totalEarned += earned;

  showModal(
    'Welcome Back!',
    `You were away for <strong>${formatTime(cappedElapsed)}</strong>.<br>
    Your generators earned crystals while you were gone!<br>
    <small>(${Math.floor(offlineRate * 100)}% offline rate)</small>`,
    `+${formatNum(earned)} crystals`
  );
}

// ─── Visibility Change (pause/resume) ────────────────────
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    saveGame();
  } else {
    // Resuming - calculate offline rewards for time away
    const now = Date.now();
    const elapsed = (now - state.lastOnline) / 1000;
    if (elapsed > 5) {
      // Small gap - just add CPS earnings
      const cps = calcCPS();
      if (cps > 0) {
        const earned = Math.floor(cps * elapsed * 0.5);
        state.crystals += earned;
        state.totalEarned += earned;
        if (elapsed > 60) {
          showToast('&#127769;', `+${formatNum(earned)} offline crystals`);
        }
      }
    }
    state.lastOnline = now;
    lastTick = now;
    updateDisplay();
    renderTab(activeTab);
  }
});

// ─── Init ────────────────────────────────────────────────
function init() {
  AudioEngine.init();

  const loaded = loadGame();

  if (loaded) {
    calcOfflineRewards();
  }

  AudioEngine.enabled = state.soundEnabled;
  state.lastOnline = Date.now();
  lastTick = Date.now();

  updateDisplay();
  renderUpgrades();

  // Save on page unload
  window.addEventListener('beforeunload', saveGame);
  window.addEventListener('pagehide', saveGame);
}

init();

})();
</script>
